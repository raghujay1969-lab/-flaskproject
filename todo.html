<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 8px;
        }
        .btn-link {
            display: inline-block;
            padding: 4px 10px;
            background-color: #f0f0f0;
            border: 1px solid #767676;
            border-radius: 2px;
            text-decoration: none;
            color: black;
            font-size: 13.33px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Hello, you can store all your to-dos here! <a href="/add-task">Add new task</a></h1>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Task</th>
                <th>Due</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
        </thead>
        <tbody>
            {% for task in todo %}
            <tr>
                <td>{{ task.id }}</td>
                <td>{{ task.title }}</td>
                <td>{{ task.task }}</td>
                <td>{{ task.due }}</td>
                <td><a href="/update_task/{{ task.id }}" class="btn-link">Edit</a></td>
                <!-- Replace line 47 with this: -->
<td><button type="button" data-id="{{ task.id }}" onclick="confirmDelete(this.dataset.id)">Delete</button></td>

            </tr>
            {% endfor %}
        </tbody>
    </table>

    <script>
        function confirmDelete(taskId) {
            const confirmation = confirm("Are you sure you want to delete this task?");
            if (confirmation) {
                fetch(`/delete/${taskId}`, {
                    method: 'DELETE'
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    alert(data.message);
                    if (data.message === 'task deleted successfully') {
                        window.location.reload();
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Failed to delete the task.');
                });
            }
        }
    </script>
</body>
</html>
